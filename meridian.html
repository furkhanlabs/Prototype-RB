<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Meridian — Your financial life. One view.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --panel-2:#f6f4ee;
  --panel-3:#ece7db;
  --border:#ddd6c7;
  --border-soft:#e8e3d7;
  --text:#211e17;
  --text-dim:#6b6659;
  --text-faint:#9c9686;
  --accent:#9c6b2e;
  --accent-soft:#9c6b2e22;
  --accent-line:#9c6b2e66;
  --positive:#3f8f65;
  --positive-soft:#3f8f6520;
  --negative:#b23f30;
  --negative-soft:#b23f3020;
  --blue:#3f6fa8;
  --violet:#7a6bab;
  --radius:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;}
body{-webkit-font-smoothing:antialiased;font-size:14px;overflow-x:hidden;}
::selection{background:var(--accent-soft);color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.serif{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- layout shell ---------- */
#shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--panel-2);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;
  transition:transform .25s ease;
}
.brand{padding:26px 22px 20px;display:flex;align-items:center;gap:10px;}
.brand-mark{width:26px;height:26px;position:relative;flex-shrink:0;}
.brand-mark svg{width:100%;height:100%;}
.brand-word{font-family:'Fraunces',serif;font-size:18px;letter-spacing:.03em;font-weight:500;}
.brand-sub{font-size:9.5px;letter-spacing:.14em;color:var(--text-faint);text-transform:uppercase;margin-top:1px;}

.nav-scroll{flex:1;overflow-y:auto;padding:6px 12px;}
.nav-group-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding:16px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--text-dim);
  font-size:13.2px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;position:relative;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--panel-3);color:var(--text);}
.nav-item.active{background:var(--panel-3);color:var(--accent);}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:2.5px;background:var(--accent);border-radius:2px;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.nav-item.active svg{opacity:1;}

.sidebar-foot{padding:14px 18px 18px;border-top:1px solid var(--border-soft);}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
.user-chip:hover{background:var(--panel-3);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,#9c6b2e,#6b4f26);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:13px;color:#111;flex-shrink:0;}
.user-meta{line-height:1.3;overflow:hidden;}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;}
.user-role{font-size:11px;color:var(--text-faint);white-space:nowrap;}

/* ---------- main ---------- */
.main-wrap{margin-left:236px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:62px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px;
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);z-index:30;
}
.hamburger{display:none;background:none;border:none;color:var(--text);padding:6px;}
.hamburger svg{width:20px;height:20px;}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--panel-2);
  border:1px solid var(--border-soft);border-radius:10px;padding:8px 12px;color:var(--text-faint);
}
.search-box svg{width:15px;height:15px;flex-shrink:0;}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;}
.search-box input::placeholder{color:var(--text-faint);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:none;color:var(--text-dim);display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--panel-2);border-color:var(--border-soft);color:var(--text);}
.icon-btn svg{width:17px;height:17px;}
.dot-badge{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--panel);}

.main{padding:26px 32px 100px;max-width:1240px;}
.page-head{margin-bottom:22px;}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;}
.page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:500;letter-spacing:-.01em;}
.page-desc{color:var(--text-dim);font-size:13.5px;margin-top:5px;max-width:620px;line-height:1.5;}

/* ---------- generic components ---------- */
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g5{grid-template-columns:repeat(5,1fr);}
.g6{grid-template-columns:repeat(6,1fr);}
.g7{grid-template-columns:repeat(7,1fr);}
.card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;
  box-shadow:0 1px 2px rgba(33,30,23,.04), 0 8px 24px rgba(33,30,23,.035);
}
.card-tight{padding:16px;}
.card-title{font-size:12.5px;color:var(--text-dim);font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title .status-dot{margin-left:auto;}

.stat-label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.stat-value{font-family:'Fraunces',serif;font-size:22px;margin-top:6px;font-weight:500;}
.stat-value.lg{font-size:30px;}
.stat-delta{font-size:12px;margin-top:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.up{color:var(--positive);}
.down{color:var(--negative);}
.flat{color:var(--text-faint);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;letter-spacing:.02em;}
.pill.gold{background:var(--accent-soft);color:var(--accent);}
.pill.green{background:var(--positive-soft);color:var(--positive);}
.pill.red{background:var(--negative-soft);color:var(--negative);}
.pill.blue{background:#3f6fa822;color:var(--blue);}
.pill.neutral{background:var(--panel-3);color:var(--text-dim);}

.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.status-dot.connected{background:var(--positive);box-shadow:0 0 0 3px var(--positive-soft);}
.status-dot.entered{background:var(--blue);box-shadow:0 0 0 3px #3f6fa822;}
.status-dot.estimated{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.status-dot.missing{background:var(--text-faint);box-shadow:0 0 0 3px #9c968620;}
.status-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);}

.btn{
  border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);display:inline-flex;align-items:center;gap:7px;transition:all .15s;
}
.btn:hover{border-color:var(--accent-line);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141008;}
.btn.primary:hover{background:#b98a49;}
.btn.ghost{background:none;border-color:var(--border-soft);color:var(--text-dim);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn svg{width:14px;height:14px;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--border-soft);}
td{padding:12px;font-size:13.2px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:var(--panel-2);}
th.num,td.num{text-align:right;}
.table-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;overflow-x:auto;}
.tab-btn{padding:10px 4px;margin-right:22px;font-size:13px;font-weight:600;color:var(--text-faint);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--accent);border-color:var(--accent);}
.tab-btn:hover{color:var(--text);}

.section-title{font-family:'Fraunces',serif;font-size:16.5px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.section-title .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);}
.note{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.note.advice{color:var(--accent);}
.disclaimer{
  font-size:11.5px;color:var(--text-faint);background:var(--panel-2);border:1px solid var(--border-soft);
  border-radius:10px;padding:10px 13px;margin-top:14px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;
}
.disclaimer svg{width:14px;height:14px;flex-shrink:0;margin-top:1px;color:var(--accent);}

.divider{height:1px;background:var(--border-soft);margin:18px 0;}
.hr-list > *+*{border-top:1px solid var(--border-soft);}
.row-flex{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
.row-flex .left{display:flex;align-items:center;gap:11px;}
.icon-chip{width:34px;height:34px;border-radius:9px;background:var(--panel-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-chip svg{width:16px;height:16px;color:var(--accent);}

/* ---------- hero ---------- */
.hero{padding:6px 0 26px;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:18px;}
.hero-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin-bottom:10px;}
.hero-value{font-family:'Fraunces',serif;font-size:52px;font-weight:500;letter-spacing:-.015em;line-height:1;}
.hero-line{height:2px;width:180px;background:var(--border);margin-top:16px;position:relative;overflow:hidden;border-radius:2px;}
.hero-line::after{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);animation:draw 1.4s cubic-bezier(.4,0,.2,1) forwards .2s;border-radius:2px;}
@keyframes draw{to{width:100%;}}
.hero-delta{margin-top:12px;font-size:14px;}
.period-toggle{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px;}
.period-toggle button{background:none;border:none;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-faint);border-radius:6px;font-family:'IBM Plex Mono',monospace;}
.period-toggle button.active{background:var(--panel-3);color:var(--accent);}
.chart-wrap{height:230px;margin-top:6px;}
.chart-wrap.sm{height:150px;}
.chart-wrap.xs{height:110px;}

/* health score ring */
.ring-wrap{position:relative;width:96px;height:96px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-center .num{font-family:'Fraunces',serif;font-size:22px;font-weight:500;}
.ring-center .den{font-size:9px;color:var(--text-faint);}

.meter{height:6px;background:var(--panel-3);border-radius:4px;overflow:hidden;margin-top:8px;}
.meter > div{height:100%;background:var(--accent);border-radius:4px;}

/* data quality legend */
.dq-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-faint);}
.dq-legend span{display:flex;align-items:center;gap:6px;}

/* assistant */
.chat-shell{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:460px;background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(33,30,23,.04), 0 8px 24px rgba(33,30,23,.035);}
.chat-log{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
.msg{max-width:74%;padding:12px 15px;border-radius:13px;font-size:13.5px;line-height:1.55;}
.msg.user{align-self:flex-end;background:var(--accent);color:#171208;border-bottom-right-radius:4px;}
.msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--border-soft);border-bottom-left-radius:4px;}
.msg.bot .tag-row{display:flex;gap:6px;margin-bottom:8px;}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:100px;}
.tag.fact{background:var(--positive-soft);color:var(--positive);}
.tag.calc{background:#3f6fa822;color:var(--blue);}
.tag.proj{background:var(--accent-soft);color:var(--accent);}
.tag.gen{background:var(--panel-3);color:var(--text-dim);}
.tag.advice{background:var(--negative-soft);color:var(--negative);}
.prompt-chips{display:flex;flex-wrap:wrap;gap:8px;padding:16px 24px;border-top:1px solid var(--border-soft);}
.chip{font-size:12px;padding:7px 12px;border-radius:100px;background:var(--panel-2);border:1px solid var(--border-soft);color:var(--text-dim);}
.chip:hover{border-color:var(--accent-line);color:var(--text);}
.chat-input-row{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border-soft);}
.chat-input-row input{flex:1;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;}
.chat-input-row input:focus{border-color:var(--accent-line);}
.send-btn{width:42px;height:42px;border-radius:10px;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn svg{width:17px;height:17px;color:#171208;}

/* connections grid */
.conn-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(33,30,23,.04), 0 8px 24px rgba(33,30,23,.035);}
.conn-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.provider-badge{width:38px;height:38px;border-radius:10px;background:var(--panel-3);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--accent);}

/* health breakdown */
.health-item{display:flex;align-items:center;gap:12px;padding:10px 0;}
.health-item .name{width:150px;font-size:12.5px;color:var(--text-dim);}
.health-item .meter{flex:1;margin:0;}
.health-item .val{width:32px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);}

/* timeline */
.tl-item{display:flex;gap:16px;padding:14px 0;position:relative;}
.tl-item::before{content:'';position:absolute;left:5px;top:28px;bottom:-14px;width:1px;background:var(--border);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--panel-3);border:2px solid var(--accent);flex-shrink:0;margin-top:4px;}
.tl-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.tl-text{font-size:13px;margin-top:3px;}

/* mobile bottom nav */
.bottom-nav{display:none;}
.mobile-drawer-overlay{display:none;}

@media (max-width:980px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.5);}
  .sidebar.open{transform:translateX(0);}
  .main-wrap{margin-left:0;}
  .hamburger{display:flex;}
  .g4,.g5,.g6,.g7{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  .main{padding:18px 16px 100px;}
  .hero-value{font-size:38px;}
  .search-box{display:none;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(255,255,255,.92);
    backdrop-filter:blur(14px);border-top:1px solid var(--border-soft);z-index:50;
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-faint);background:none;border:none;font-size:10px;font-weight:600;}
  .bn-item svg{width:19px;height:19px;}
  .bn-item.active{color:var(--accent);}
  .mobile-drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .mobile-drawer-overlay.show{display:block;opacity:1;pointer-events:auto;}
}
@media (max-width:600px){
  .g2{grid-template-columns:1fr;}
  .g3,.g4,.g5,.g6,.g7{grid-template-columns:repeat(2,1fr);}
  .hero-value{font-size:32px;}
  .msg{max-width:88%;}
}
@media (prefers-reduced-motion:reduce){
  .hero-line::after{animation:none;width:100%;}
  *{transition:none !important;animation:none !important;}
}

/* ---------- calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px;}
.cal-head{font-size:10px;color:var(--text-faint);text-align:center;padding:4px 0;font-weight:600;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;background:var(--panel-2);position:relative;}
.cal-cell.empty{background:none;}
.cal-cell.has-event{background:var(--accent-soft);border:1px solid var(--accent-line);cursor:default;}
.cal-day{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.cal-cell.has-event .cal-day{color:var(--accent);font-weight:600;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}

/* ---------- market ticker strip ---------- */
.ticker-strip{display:flex;gap:0;overflow-x:auto;margin-bottom:20px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--panel);box-shadow:0 1px 2px rgba(33,30,23,.04), 0 8px 24px rgba(33,30,23,.035);}
.ticker-item{padding:14px 18px;flex-shrink:0;border-right:1px solid var(--border-soft);min-width:118px;}
.ticker-item:last-child{border-right:none;}
.ticker-name{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.ticker-value{font-family:'IBM Plex Mono',monospace;font-size:14.5px;margin-top:4px;font-weight:600;}
.ticker-delta{font-size:11px;margin-top:3px;font-weight:600;}

/* ---------- market search ---------- */
.market-search-wrap{position:relative;margin-bottom:18px;}
.market-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;box-shadow:0 12px 32px rgba(33,30,23,.12);max-height:340px;overflow-y:auto;z-index:20;}
.market-result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border-soft);}
.market-result-row:last-child{border-bottom:none;}
.market-result-row:hover{background:var(--panel-2);}

/* ---------- instrument table extras ---------- */
.type-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.type-filter-row button{font-size:12px;padding:7px 13px;border-radius:100px;background:var(--panel-2);border:1px solid var(--border-soft);color:var(--text-dim);font-weight:600;}
.type-filter-row button.active{background:var(--accent);border-color:var(--accent);color:#171208;}
.asset-row{cursor:pointer;}
.asset-row:hover{background:var(--panel-2);}
.watch-star{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;cursor:pointer;}
.watch-star.active{color:var(--accent);}
.cmp-check{width:14px;height:14px;accent-color:#9c6b2e;cursor:pointer;}

/* ---------- compare tray ---------- */
.compare-tray{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:45;background:var(--panel-3);
  border:1px solid var(--border);border-radius:100px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:14px;
  box-shadow:0 16px 40px rgba(33,30,23,.18);
}
@media (max-width:980px){ .compare-tray{ bottom:78px; } }

/* ---------- asset detail modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,17,10,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:700px){ .modal-overlay{align-items:center;} }
.modal-sheet{
  background:var(--panel);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  border:1px solid var(--border-soft);box-shadow:0 20px 60px rgba(33,30,23,.2);
}
@media (min-width:700px){ .modal-sheet{border-radius:18px;} }
.modal-head{position:sticky;top:0;background:var(--panel);padding:20px 24px 14px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:flex-start;z-index:2;}
.modal-close{width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:none;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
.modal-body{padding:20px 24px 26px;}

/* ---------- watchlist tabs ---------- */
.wl-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.wl-tabs button{font-size:12.5px;padding:8px 14px;border-radius:100px;background:var(--panel-2);border:1px solid var(--border-soft);color:var(--text-dim);font-weight:600;}
.wl-tabs button.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}

/* ---------- discover mini cards ---------- */
.discover-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;}
.discover-card{flex-shrink:0;width:170px;background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:13px;box-shadow:0 1px 2px rgba(33,30,23,.04);}

/* ---------- chat mode toggle ---------- */
.mode-toggle{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px;margin-bottom:16px;width:fit-content;}
.mode-toggle button{background:none;border:none;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--text-faint);border-radius:6px;}
.mode-toggle button.active{background:var(--panel-3);color:var(--accent);}
</style>
</head>

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function monthCalendar(year, monthIdx, label){
  const first = new Date(year, monthIdx, 1);
  const startWeekday = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
  const evByDay = {};
  D.calendar.forEach(e=>{
    const d = new Date(e.date+'T00:00:00');
    if(d.getFullYear()===year && d.getMonth()===monthIdx) evByDay[d.getDate()] = (evByDay[d.getDate()]||[]).concat(e);
  });
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const has = evByDay[day];
    cells += `<div class="cal-cell ${has?'has-event':''}" title="${has?has.map(e=>e.text).join(' · '):''}">
      <span class="cal-day">${day}</span>${has?`<span class="cal-dot"></span>`:''}
    </div>`;
  }
  return `
  <div class="card">
    <div class="card-title">${label}</div>
    <div class="cal-grid">
      ${['M','T','W','T','F','S','S'].map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}

function marketChatAnswer(q){
  const s = q.toLowerCase();
  if(s.includes('lowest') && s.includes('charge')){
    const top = instrumentsOfType('Fund').slice().sort((a,b)=>a.charge-b.charge).slice(0,3);
    return botMsg('fact','Information', `Lowest ongoing charges among tracked funds: ${top.map(f=>`${f.name} (${f.charge.toFixed(2)}%)`).join(', ')}. Source: fund fact sheets · Data date: ${MARKET.updated}.`);
  }
  if(s.includes('top') && s.includes('uk fund')){
    const top = instrumentsOfType('Fund').filter(f=>f.category && f.category.toLowerCase().includes('uk')).sort((a,b)=>b.y1-a.y1).slice(0,3);
    return botMsg('fact','Information', `Top performing UK funds this year (1Y total return): ${top.map(f=>`${f.name} ${pctStr(f.y1)}`).join(', ')}. Methodology: 1-year total return, ranked highest first. Data date: ${MARKET.updated}.`);
  }
  if(s.includes('dividend') && s.includes('uk')){
    const top = instrumentsOfType('Stock').filter(t=>t.region==='UK').sort((a,b)=>b.divYield-a.divYield).slice(0,3);
    return botMsg('fact','Information', `Highest dividend-paying UK stocks tracked: ${top.map(t=>`${t.name} (${t.divYield.toFixed(1)}%)`).join(', ')}. Source: simulated prototype feed · Data date: ${MARKET.updated}.`);
  }
  if(s.includes('s&p 500') && s.includes('pension')){
    return botMsg('fact','Information', `US Equity Pension Fund (Provider E) tracks US large-cap equity, similar in exposure to the S&P 500, and is available in your connected workplace pension.`);
  }
  if(s.includes('global equity') && s.includes('pension')){
    const list = MARKET.pensionFunds.filter(p=>p.category==='Global equity');
    return botMsg('fact','Information', `Global equity funds available through pension platforms: ${list.map(l=>l.name).join(', ')}.`);
  }
  if(s.includes('largest') && s.includes('trust')){
    return botMsg('fact','Information', `Among tracked investment trusts, Global Growth Trust and UK Income & Growth Trust are the largest by NAV in this dataset. Source: simulated prototype feed.`);
  }
  if(s.includes('five year') || s.includes('5 year') || s.includes('5y')){
    const top = MARKET.all.filter(i=>i.y5!=null).sort((a,b)=>b.y5-a.y5).slice(0,3);
    return botMsg('fact','Information', `Best 5-year historical performers tracked: ${top.map(t=>`${t.name} ${pctStr(t.y5)}`).join(', ')}. Past performance is not a guide to future returns. Data date: ${MARKET.updated}.`);
  }
  if(s.includes('compare')){
    return botMsg('calc','Analysis', `Add up to 5 products to your comparison tray using the checkbox on any row in Markets, then tap Compare to see facts side by side.`);
  }
  if(s.includes('india')){
    return botMsg('fact','Information', `Emerging Markets Fund and Emerging Markets Pension Fund both include exposure to India as part of a broader emerging-markets allocation. This prototype doesn't break down country-level weightings further.`);
  }
  if(s.includes('should i buy') || s.includes('which one should i') || s.includes('best fund for me') || s.includes('recommend')){
    return botMsg('advice','Personal financial advice needed', `This question may require personalised regulated investment advice, which takes your full circumstances into account. Speak to a regulated adviser.`);
  }
  return botMsg('gen','General information', `I can surface factual data on stocks, funds, ETFs, bonds, pension funds, trusts and REITs — owned or not. Try asking about top performers, charges, or dividend yields — I'll always show source, data date and methodology.`);
}

const TYPE_PLURAL = {Stock:'stocks', Fund:'funds', ETF:'ETFs', Bond:'bonds', 'Pension fund':'pension funds', 'Investment trust':'investment trusts', REIT:'REITs'};
function instrumentsOfType(type){ return MARKET.all.filter(i=>i.type===type); }
function isWatched(id){ return Object.values(MARKET.watchlists).some(list=>list.includes(id)); }
function watchStarSVG(id){
  return `<span class="watch-star ${isWatched(id)?'active':''}" data-star="${id}">${ICONS.star}</span>`;
}
function genericTable(list, type){
  const cols = COLS[type] || COLS.Stock;
  if(!list.length) return `<div style="text-align:center;color:var(--text-faint);padding:30px;">No matches.</div>`;
  return `
  <div class="table-scroll">
  <table>
    <thead><tr><th></th><th></th>${cols.map(c=>`<th class="${c.num?'num':''}">${c.label}</th>`).join('')}</tr></thead>
    <tbody>
      ${list.map(i=>`
        <tr class="asset-row" data-asset="${i.id}">
          <td style="width:18px;"><input type="checkbox" class="cmp-check" data-cmp="${i.id}" ${state.compare.includes(i.id)?'checked':''}></td>
          <td style="width:18px;">${watchStarSVG(i.id)}</td>
          ${cols.map(c=>`<td class="${c.num?'num':''} ${c.mono?'mono':''} ${c.cls?c.cls(i):''}">${c.get(i)}</td>`).join('')}
        </tr>`).join('')}
    </tbody>
  </table>
  </div>`;
}
function marketTypeTab(type){
  const all = instrumentsOfType(type);
  let list = all;
  if(state.marketFilter==='Owned') list = list.filter(i=>i.owned);
  if(state.marketSearch) list = list.filter(i=>i.name.toLowerCase().includes(state.marketSearch.toLowerCase()) || (i.ticker&&i.ticker.toLowerCase().includes(state.marketSearch.toLowerCase())));
  const plural = TYPE_PLURAL[type] || type+'s';
  const ownedCount = all.filter(i=>i.owned).length;
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
    <div style="color:var(--text-dim);font-size:13px;"><strong>${all.length}</strong> supported ${plural} tracked · you own ${ownedCount}</div>
    <div class="type-filter-row" style="margin:0;">
      <button class="${state.marketFilter==='All'?'active':''}" data-mfilter="All">All ${plural}</button>
      <button class="${state.marketFilter==='Owned'?'active':''}" data-mfilter="Owned">My ${plural} (${ownedCount})</button>
    </div>
  </div>
  <div class="card">${genericTable(list, type)}</div>
  `;
}
function assetMiniRow(i, field){

          ${i.availableInMyPension!=null?rowKV('Available in my pension', i.availableInMyPension?'Yes':'Not currently'):''}
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
          <button class="btn ghost sm" id="modalWatchBtn" data-star="${i.id}">${isWatched(i.id)?'★ On watchlist':'☆ Add to watchlist'}</button>
          <button class="btn ghost sm" id="modalCompareBtn" data-cmp="${i.id}">${state.compare.includes(i.id)?'− Remove from compare':'+ Add to compare'}</button>
        </div>
        <div class="note">Data last updated ${MARKET.updated} · Historical performance is not a guide to future returns.</div>
      </div>
    </div>
  </div>`;
}
function compareModalHTML(){
  const items = state.compare.map(id=>MARKET.all.find(i=>i.id===id)).filter(Boolean).slice(0,5);
  const rows = [
    ['1Y return', i=>i.y1!=null?pctStr(i.y1):'—'],
    ['5Y return', i=>i.y5!=null?pctStr(i.y5):'—'],
    ['Charge', i=>i.charge!=null?i.charge.toFixed(2)+'%':'—'],
    ['Risk', i=>i.risk||'—'],
    ['Yield', i=>{const y=i.divYield!=null?i.divYield:(i.yield!=null?i.yield:(i.dividend!=null?i.dividend:null)); return y!=null?y.toFixed(1)+'%':'—';}],
  ];
  return `
  <div class="modal-overlay" id="overlayBg">
    <div class="modal-sheet" style="max-width:820px;">
      <div class="modal-head">
        <div><div class="pill gold" style="margin-bottom:8px;">Compare facts</div><div class="serif" style="font-size:20px;font-weight:500;">Comparing ${items.length} product${items.length===1?'':'s'}</div></div>
        <button class="modal-close" id="closeModalBtn">${ICONS.close}</button>
      </div>
      <div class="modal-body">
        ${items.length ? `
        <div class="table-scroll">
        <table>
          <thead><tr><th></th>${items.map(i=>`<th>${i.name}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(([label,fn])=>`<tr><td style="color:var(--text-faint);">${label}</td>${items.map(i=>`<td class="mono">${fn(i)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
        </div>
        <button class="btn ghost sm" id="clearCompareBtn" style="margin-top:16px;">Clear comparison</button>
        ` : `<div style="text-align:center;color:var(--text-faint);padding:20px;">Nothing selected yet — use the checkbox on any product row in Markets.</div>`}
        ${disclaimer('This compares publicly available facts side by side. It is not a personalised recommendation of which product to choose.')}
      </div>
    </div>
  </div>`;
}
function toggleWatch(id){
  const list = MARKET.watchlists[state.watchlistActive] || (MARKET.watchlists[state.watchlistActive]=[]);
  const idx = list.indexOf(id);
  if(idx>-1) list.splice(idx,1); else list.push(id);
}
function toggleCompare(id){
  const idx = state.compare.indexOf(id);
  if(idx>-1) state.compare.splice(idx,1);
  else if(state.compare.length<5) state.compare.push(id);
}
function openAsset(id){ state.assetModal=id; state.compareOpen=false; renderOverlay(); }
function renderOverlay(){
  const root = document.getElementById('modalRoot');
  if(!root) return;
  if(state.compareOpen) root.innerHTML = compareModalHTML();
  else if(state.assetModal) root.innerHTML = assetModalHTML(state.assetModal);
  else root.innerHTML = '';
}
function renderCompareTray(){
  const el = document.getElementById('compareTray');
  if(!el) return;
  if(state.compare.length===0){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='flex';
  el.innerHTML = `
    <span style="font-size:12.5px;color:var(--text-dim);">${state.compare.length} selected</span>
    <button class="btn ghost sm" id="trayClear">Clear</button>
    <button class="btn primary sm" id="trayCompare">Compare</button>
  `;
}

/* ---------------- router ---------------- */
const RENDERERS = {
  overview:renderOverview, mywealth:renderMyWealth, balance:renderMyWealth, accounts:renderMyWealth,
  markets:renderMarkets, invest:renderInvest, pension:renderPension, cash:renderCash, property:renderProperty,
  debt:renderDebt, protection:renderProtection, tax:renderTax, goals:renderGoals, insights:renderInsights,
  docs:renderDocs, assistant:renderAssistant, notifications:renderNotifications, privacy:renderPrivacy, profile:renderProfile,
};

function renderMain(){
  destroyCharts();
  const fn = RENDERERS[state.section] || renderOverview;
  document.getElementById('main').innerHTML = fn();
  try{ wireSection(); }catch(e){ console.warn('wireSection error:', e); }
  try{ initCharts(); }catch(e){ console.warn('initCharts error:', e); }
  try{ renderCompareTray(); }catch(e){ console.warn('compare tray error:', e); }
}

/* ---------------- section-specific wiring ---------------- */
function wireSection(){
  if(state.section==='overview'){
    const t = document.getElementById('periodToggle');
    if(t) t.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.period=b.dataset.p; renderMain();});
  }
  if(state.section==='invest'){
    document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{state.invTab=b.dataset.tab; renderMain();});
  }
  if(state.section==='pension'){
    ['curAge','retAge','monthlyContrib','employerContrib'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.oninput = updateRetirement;
    });
    updateRetirement();
  }
  if(state.section==='assistant'){
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>sendChat(c.dataset.prompt));
    const btn = document.getElementById('sendBtn');
    const input = document.getElementById('chatInput');
    if(btn) btn.onclick=()=>{ if(input.value.trim()){ sendChat(input.value.trim()); input.value=''; } };
    if(input) input.onkeydown=(e)=>{ if(e.key==='Enter' && input.value.trim()){ sendChat(input.value.trim()); input.value=''; } };
  }
  if(state.section==='markets'){
    const msi = document.getElementById('marketSearchInput');
    if(msi){
      msi.oninput = (e)=>{
        state.marketSearch = e.target.value;
        renderMain();
        const el = document.getElementById('marketSearchInput');
        if(el){ el.focus(); const p = el.value.length; el.setSelectionRange(p,p); }
      };
    }
  }
}

function chatAnswer(q){
  const s = q.toLowerCase();
  if(s.includes('own') || s.includes('worth')){
    return botMsg('fact','Fact', `Your total net worth is <strong>${money(D.netWorth)}</strong>, combining cash, investments, pensions and property, minus liabilities. Retrieved from your connected accounts as of today.`);
  }
  if(s.includes('where is my money') || s.includes('largest holding')){
    const top = D.holdings.slice().sort((a,b)=>b.value-a.value)[0];
    return botMsg('fact','Fact', `Your largest single holding is <strong>${top.name}</strong> at ${money(top.value)}. Across all accounts, the biggest concentration is in ${D.snapshot[3].label.toLowerCase()} at ${money(D.snapshot[3].value)}.`);
  }
  if(s.includes('fee')){
    return botMsg('calc','Calculation', `Based on your fund charges and platform fees, you're paying an estimated <strong>£1,940 a year (0.45%)</strong> across your investment portfolio.`);
  }
  if(s.includes('liquid')){
    const liquid = D.snapshot[0].value + D.snapshot[1].value;
    return botMsg('calc','Calculation', `Your liquid wealth — cash plus investments you could realistically access — is <strong>${money(liquid)}</strong>, or ${(liquid/D.netWorth*100).toFixed(0)}% of your net worth.`);
  }
  if(s.includes('retire')){
    return botMsg('proj','Projection', `At your current contribution rate and a 5% growth assumption, your pension could reach roughly <strong>£1.1m by age 65</strong>. This is illustrative, based on assumptions, and not a guarantee — visit the Pensions page to adjust inputs.`);
  }
  if(s.includes('changed')){
    return botMsg('fact','Fact', D.whatChanged.map(c=>`${c.label} ${c.dir==='up'?'↑':'↓'} ${c.delta}`).join(' · '));
  }
  if(s.includes('invest in') || s.includes('should i buy') || s.includes('sell')){
    return botMsg('advice','Regulated advice needed', `I can't recommend specific investments to buy or sell. Speak to a regulated financial adviser for personalised advice tailored to your circumstances.`);
  }
  return botMsg('gen','General information', `Here's what I can tell you from your connected data — try one of the suggested questions below, or ask about a specific account, holding, or goal.`);
}
function sendChat(text){
  const log = document.getElementById('chatLog');
  log.insertAdjacentHTML('beforeend', userMsg(text));
  const answer = state.chatMode==='market' ? marketChatAnswer(text) : chatAnswer(text);
  log.insertAdjacentHTML('beforeend', answer);
  log.scrollTop = log.scrollHeight;
}

function updateRetirement(){
  const curAge = +document.getElementById('curAge').value || 42;
  const retAge = +document.getElementById('retAge').value || 65;
  const monthly = +document.getElementById('monthlyContrib').value || 0;
  const employer = +document.getElementById('employerContrib').value || 0;
  const years = Math.max(retAge-curAge,0);
  const growth = 0.05, current = D.pensions.total;

  function project(rate){
    let pot = current;
    const series=[pot];
    for(let y=0;y<years;y++){
      pot = pot*(1+rate) + (monthly+employer)*12;
      series.push(Math.round(pot));
    }
    return series;
  }
  const cons = project(0.03), mod = project(0.05), high = project(0.07);
  const finalMod = mod[mod.length-1];
  const annualIncome = Math.round(finalMod*0.04);

  document.getElementById('retirementOutputs').innerHTML = `
    <div class="card card-tight"><div class="stat-label">Projected pot at ${retAge} (moderate)</div><div class="stat-value" style="font-size:20px;">${money(finalMod)}</div></div>
    <div class="card card-tight"><div class="stat-label">Estimated annual income</div><div class="stat-value" style="font-size:20px;">${money(annualIncome)}</div></div>
    <div class="card card-tight"><div class="stat-label">Years to retirement</div><div class="stat-value" style="font-size:20px;">${years}</div></div>
  `;

  if(charts.ret && charts.ret.destroy) { try{ charts.ret.destroy(); }catch(e){} }
  const ctx = document.getElementById('retChart');
  if(ctx){
    charts.ret = newChart(ctx, {
      type:'line',
      data:{labels:cons.map((_,i)=>curAge+i), datasets:[
        lineSet('Higher growth', high, '#9c6b2e', false),
        lineSet('Moderate', mod, '#3f8f65', true),
        lineSet('Conservative', cons, '#3f6fa8', false),
      ]},
      options: chartOpts({y:{ticks:{callback:v=>'£'+(v/1000).toFixed(0)+'k'}}}, true)
    });
  }
}
function lineSet(label,data,color,fill){
  return {label,data,borderColor:color,backgroundColor:color+'22',fill:fill,tension:.35,pointRadius:0,borderWidth:2};
}

/* ---------------- chart helpers ---------------- */
function chartOpts(scalesExtra={}, legend=false){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:legend, labels:{color:'#6b6659', font:{family:'Inter',size:11}, boxWidth:10}}, tooltip:{backgroundColor:'#f6f4ee', borderColor:'#ddd6c7', borderWidth:1, titleColor:'#211e17', bodyColor:'#211e17', padding:10}},
    scales:{
      x:{grid:{color:'#e8e3d7'}, ticks:{color:'#9c9686', font:{family:'IBM Plex Mono',size:10}}},
      y:{grid:{color:'#e8e3d7'}, ticks:{color:'#9c9686', font:{family:'IBM Plex Mono',size:10}}, ...scalesExtra.y},
    }
  };
}
function initCharts(){
  const s = state.section;
  if(s==='overview'){
    const data = D.nwSeries[state.period];
    const labels = data.map((_,i)=>i+1);
    const ctx = document.getElementById('nwChart');
    if(ctx) charts.nw = newChart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:'#9c6b2e',backgroundColor:'#9c6b2e1a',fill:true,tension:.35,pointRadius:0,borderWidth:2.2}]},
      options: chartOpts({y:{ticks:{callback:v=>'£'+v+'k'}}})});
  }
  if(s==='mywealth' && state.wealthTab==='balance'){
    const ctx = document.getElementById('allocDonutBalance');
    if(ctx) charts.bal = newChart(ctx,{type:'doughnut',data:{labels:['Cash','Investments','Pensions','Property','Other'],datasets:[{data:[84.25,426.84,483.53,620,20],backgroundColor:['#3f6fa8','#9c6b2e','#7a6bab','#3f8f65','#9c9686'],borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#6b6659',boxWidth:9,font:{size:10.5}}}}}});
  }
  if(s==='insights' && state.insightsTab==='wealthgen'){
    const ctx = document.getElementById('waterfallChart');
    if(ctx){
      const wg = D.wealthGen;
      let running = wg.start;
      const labels=['Start']; const data=[[0,wg.start]]; const colors=['#9c9686'];
      wg.steps.forEach(st=>{
        const from=running; running+=st.value;
        labels.push(st.label);
        data.push([Math.min(from,running), Math.max(from,running)]);
        colors.push(st.value>=0?'#3f8f65':'#b23f30');
      });
      labels.push('Current'); data.push([0,wg.end]); colors.push('#9c6b2e');
      charts.waterfall = newChart(ctx,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:4}]},
        options: chartOpts({y:{ticks:{callback:v=>'£'+(v/1000).toFixed(0)+'k'}}})});
    }
  }
  if(s==='invest'){
    if(state.invTab==='overview'){
      const ctx1=document.getElementById('investPerfChart');
      if(ctx1) charts.perf = newChart(ctx1,{type:'line',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'],datasets:[{data:[388,395,401,398,410,415,421,426.8],borderColor:'#3f8f65',backgroundColor:'#3f8f6520',fill:true,tension:.35,pointRadius:0,borderWidth:2}]},
        options:chartOpts({y:{ticks:{callback:v=>'£'+v+'k'}}})});
      const ctx2=document.getElementById('maturityChart');
      if(ctx2) charts.mat = newChart(ctx2,{type:'bar',data:{labels:D.bonds.map(b=>b.maturity),datasets:[{data:D.bonds.map(b=>b.value/1000),backgroundColor:'#9c6b2e',borderRadius:4}]},
        options:chartOpts({y:{ticks:{callback:v=>'£'+v+'k'}}})});
    }
    if(state.invTab==='allocation'){
      const ctx=document.getElementById('allocChart');
      if(ctx) charts.alloc = newChart(ctx,{type:'doughnut',data:{labels:D.allocation.map(a=>a.label),datasets:[{data:D.allocation.map(a=>a.v),backgroundColor:D.allocation.map(a=>a.color),borderWidth:0}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:'#6b6659',boxWidth:9,font:{size:10.5}}}}}});
    }
  }
  if(s==='cash'){
    const ctx=document.getElementById('cashMaturityChart');
    if(ctx) charts.cashMat = newChart(ctx,{type:'bar',data:{labels:D.cashAccounts.map(a=>a.name.split(' ').slice(0,2).join(' ')),datasets:[{data:D.cashAccounts.map(a=>a.balance/1000),backgroundColor:'#3f6fa8',borderRadius:4}]},
      options:chartOpts({y:{ticks:{callback:v=>'£'+v+'k'}}})});
  }
  if(s==='debt'){
    const ctx=document.getElementById('debtChart');
    if(ctx) charts.debt = newChart(ctx,{type:'line',data:{labels:D.debt.timeline.map(t=>t.year),datasets:[{data:D.debt.timeline.map(t=>t.v/1000),borderColor:'#b23f30',backgroundColor:'#b23f3020',fill:true,tension:.3,pointRadius:3,borderWidth:2}]},
      options:chartOpts({y:{ticks:{callback:v=>'£'+v+'k'}}})});
  }
  if(s==='tax'){
    const ctx1=document.getElementById('taxIncomeChart');
    if(ctx1) charts.taxInc = newChart(ctx1,{type:'bar',data:{labels:D.tax.monthlyIncome.map(m=>m.m),datasets:[{data:D.tax.monthlyIncome.map(m=>m.v),backgroundColor:'#9c6b2e',borderRadius:4}]},
      options:chartOpts({y:{ticks:{callback:v=>'£'+(v/1000).toFixed(1)+'k'}}})});
    const ctx2=document.getElementById('spendChart');
    if(ctx2) charts.spend = newChart(ctx2,{type:'bar',data:{labels:D.cashflow.spend.map(s=>s.label),datasets:[{data:D.cashflow.spend.map(s=>s.v),backgroundColor:'#3f8f65',borderRadius:4}]},
      options:{...chartOpts(),indexAxis:'y'}});
  }
}

/* ---------------- global delegated interactions ---------------- */
function handleGlobalClick(e){
  const modalWatchBtn = e.target.closest('#modalWatchBtn');
  if(modalWatchBtn){ toggleWatch(modalWatchBtn.dataset.star); renderOverlay(); return; }
  const modalCompareBtn = e.target.closest('#modalCompareBtn');
  if(modalCompareBtn){ toggleCompare(modalCompareBtn.dataset.cmp); renderOverlay(); renderCompareTray(); return; }
  const starSpan = e.target.closest('.watch-star');
  if(starSpan){ toggleWatch(starSpan.dataset.star); renderMain(); return; }
  const cmpCheckbox = e.target.closest('.cmp-check');
  if(cmpCheckbox){ toggleCompare(cmpCheckbox.dataset.cmp); renderMain(); return; }
  const assetEl = e.target.closest('[data-asset]');
  if(assetEl){ openAsset(assetEl.dataset.asset); return; }
  const mtabnav = e.target.closest('[data-mtabnav]');
  if(mtabnav){ state.marketTab = mtabnav.dataset.mtabnav; renderMain(); return; }
  const mfilter = e.target.closest('[data-mfilter]');
  if(mfilter){ state.marketFilter = mfilter.dataset.mfilter; renderMain(); return; }
  const wtab = e.target.closest('[data-wtab]');
  if(wtab){ state.wealthTab = wtab.dataset.wtab; renderMain(); return; }
  const itab = e.target.closest('[data-itab]');
  if(itab){ state.insightsTab = itab.dataset.itab; renderMain(); return; }
  const evEl = e.target.closest('[data-event]');
  if(evEl){ state.lifeEventSelected = evEl.dataset.event; renderMain(); return; }
  const wlEl = e.target.closest('[data-wl]');
  if(wlEl){ state.watchlistActive = wlEl.dataset.wl; renderMain(); return; }
  const chatModeEl = e.target.closest('[data-chatmode]');
  if(chatModeEl){ state.chatMode = chatModeEl.dataset.chatmode; renderMain(); return; }
  const closeBtn = e.target.closest('#closeModalBtn');
  if(closeBtn || e.target.id==='overlayBg'){ state.assetModal=null; state.compareOpen=false; renderOverlay(); return; }
  if(e.target.id==='trayClear'){ state.compare=[]; renderMain(); return; }
  if(e.target.id==='trayCompare'){ state.compareOpen=true; renderOverlay(); return; }
  if(e.target.id==='clearCompareBtn'){ state.compare=[]; state.compareOpen=false; renderOverlay(); renderMain(); return; }
}
document.addEventListener('click', e=>{ try{ handleGlobalClick(e); }catch(err){ console.warn('global click error:', err); } });

const globalSearchEl = document.getElementById('globalSearch');
if(globalSearchEl){
  globalSearchEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.value.trim()){
      state.marketSearch = e.target.value.trim();
      go('markets');
    }
  });
}

/* ---------------- init ---------------- */
try{
  if(typeof Chart !== 'undefined'){ Chart.defaults.font.family = 'Inter'; }
}catch(e){ console.warn('Chart.js defaults setup skipped:', e); }
renderNav();
renderMain();
</script>
